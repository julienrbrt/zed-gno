id = "gno"
name = "Gno"
version = "0.1.2"
schema_version = 1
authors = ["julienrbrt <https://github.com/julienrbrt>"]
description = "Gno language support with gnopls LSP (diagnostics, completions, go-to-definition, hover)"
repository = "https://github.com/julienrbrt/zed-gno"

[language_servers.gnopls]
name = "gnopls"
languages = ["Gno"]

# Same grammar Zed bundles natively (name "go" matches tree-sitter-go's
# exported symbol); Zed prefers its native grammar at runtime.
[grammars.go]
repository = "https://github.com/zed-industries/tree-sitter-go"
rev = "6862a49e3c5a7567a6c576420e9a8f944e198a85"
